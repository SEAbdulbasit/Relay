<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Relay</title>
  <desc>Two blue signal paths pass a task forward over a deep navy tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0%" y1="0%" x2="88%" y2="100%">
      <stop offset="0" stop-color="#283B58"/>
      <stop offset="0.50" stop-color="#15253D"/>
      <stop offset="1" stop-color="#0B1322"/>
    </linearGradient>
    <radialGradient id="light" cx="33%" cy="21%" r="69%">
      <stop offset="0" stop-color="#5876A7" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#5876A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="6%" y1="0%" x2="90%" y2="100%">
      <stop offset="0" stop-color="#9CB3D5" stop-opacity="0.68"/>
      <stop offset="0.52" stop-color="#6084A9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#395272" stop-opacity="0.50"/>
    </linearGradient>
    <linearGradient id="signal" gradientUnits="userSpaceOnUse" x1="30" y1="18" x2="67" y2="84">
      <stop offset="0" stop-color="#F1FAFF"/>
      <stop offset="0.51" stop-color="#B6E9FA"/>
      <stop offset="1" stop-color="#65A7E9"/>
    </linearGradient>
    <!-- Match RelaySignalGlyph in Sources/Relay/RelayDesignSystem.swift. -->
    <path id="handoff" d="M17 78 L35 36 C39 27 42 24 49 24 L64 24 M83 22 L65 64 C61 73 58 76 51 76 L36 76"/>
  </defs>

  <rect x="92" y="102" width="840" height="840" rx="209" fill="#060C17" opacity="0.20"/>
  <rect x="91" y="93" width="842" height="842" rx="209" fill="#060C17" opacity="0.48"/>
  <rect x="92" y="84" width="840" height="840" rx="208" fill="url(#tile)"/>
  <rect x="92" y="84" width="840" height="840" rx="208" fill="url(#light)"/>
  <rect x="94" y="86" width="836" height="836" rx="206" fill="none" stroke="url(#rim)" stroke-width="4"/>

  <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <use href="#handoff" transform="translate(147 150) scale(7.3)" stroke="#080F1E" opacity="0.58"/>
    <use href="#handoff" transform="translate(147 139) scale(7.3)" stroke="url(#signal)"/>
  </g>
</svg>
