function message(m,i){if(m.type==='artifact')return `<article class="message assistant"><span class="speaker">Relay</span><p>${esc(m.text)}</p><div class="artifact-card"><div class="artifact-icon">${icon('file')}</div><div><strong>Project decisions brief</strong><span>Prepared in this conversation · not saved to disk</span></div>${button('Open preview',`openArtifact(${i})`)}</div><details class="evidence"><summary>What was checked</summary><div class="evidence-row"><span>Source scope</span><div>Project notes.md${m.year?' · 2026 only':''}<small>Synthetic source, version ${m.sourceVersion}</small></div></div><div class="evidence-row"><span>Readback</span><div>Prepared text compared with source excerpts<small>Source matching is weaker than proof of every generated claim.</small></div></div><p class="note-line">No file save, send or application change is claimed.</p></details></article>`;return `<article class="message ${m.role}"><span class="speaker">${m.role==='user'?'You':'Relay'}</span><p>${esc(m.text)}</p></article>`}function runCard(){if(!['running','stopping','stopped','changed'].includes(a.phase))return '';const labels=['Inspect selected project notes','Extract decisions and owners','Prepare the brief','Check against source text'];return `<div class="inline-activity"><div class="activity-top"><span class="activity-status">${icon(a.phase==='running'?'spark':'stop')}<strong>${a.phase==='running'?labels[Math.min(a.step,3)]:a.phase==='stopping'?'Stopping — no new dispatch':a.phase==='changed'?'Context changed — needs your input':'Stopped — progress preserved'}</strong></span><span class="tiny">${a.step}/4 checked steps</span></div><details><summary>Plan & activity</summary><p class="note-line">Plan: inspect the selected notes, identify decisions, draft a brief, check sources. Tool activity below is simulated; no hidden reasoning is shown.</p>${labels.map((t,i)=>`<div class="activity-step">${icon(i<a.step?'check':'clock')}<span>${t}</span><small>${i<a.step?'Verified':i===a.step?'Unverified / in progress':'Not attempted'}</small></div>`).join('')}</details>${a.phase==='running'?`<button class="steer-chip" onclick="steerSeed()">Add “only this year” ${icon('arrow')}</button>`:a.phase==='stopped'?`<p class="note-line">No files changed. Checked steps are preserved; the interrupted operation is unverified.</p>${button('Inspect & resume','resume()')}`:a.phase==='changed'?button('Use current selected context','renewScope()'):''}</div>`}
function send(){saveDraft();if(a.phase==='stopping'){say('Stopping is still settling. Your draft is preserved; send it after the task stops.');return}const text=a.draft.trim();if(!text)return;a.draft='';push('user',text);if(!a.model){push('assistant','The local model is unavailable. Restore local readiness in Settings before continuing. No hosted fallback will be used.');render();return}if(a.phase==='running'){if(text==='What is the difference between a decision and an action item?'){push('assistant','A decision records what was agreed; an action item records the next step, an owner and ideally a due date. I’m continuing the active brief task.');render();return}if(/^only (include )?(this year|2026)[.!]?$/i.test(text)){applySteering();return}if(text==='What have you checked so far?'){push('assistant',`${a.step} preparation steps are checked. The current operation is still unverified; no files have changed.`);render();return}push('assistant','I’ve kept your message in this conversation. This prototype can demonstrate “only this year” as mid-task steering, but it cannot reliably interpret this new instruction. No further operation will start until the task is clarified.');clearTimeout(a.timer);a.phase='stopped';render();return}if(text===seed){if(!a.source){push('assistant','Please attach the example project notes so I can inspect the requested source. Nothing has run.');render();return}push('assistant','I’ll inspect the selected project notes, pull out the decisions and owners, and prepare a brief here. I’ll check it against the source before reporting back.');a.scope=a.sourceVersion;a.phase='running';a.step=0;a.year=false;a.artifact=false;render();tick();return}if(text==='What is the difference between a decision and an action item?'){push('assistant','A decision records what was agreed. An action item records what someone must do next, ideally with an owner and a due date. One decision can create several action items.');render();return}if(a.phase==='stopped'&&/^only (include )?(this year|2026)[.!]?$/i.test(text)){a.year=true;a.step=Math.min(a.step,1);push('assistant','I’ve updated the task to include only 2026. It remains stopped; choose Inspect & resume when you’re ready.');render();return}push('assistant','This is a design prototype rather than a working model. Your request remains in the conversation, but I can’t truthfully execute or answer it here. The two labeled seeded examples demonstrate a direct answer and a task in the same chat; they are examples, not product modes.');render()}
function tick(){clearTimeout(a.timer);a.timer=setTimeout(()=>{if(a.phase!=='running')return;if(a.sourceVersion!==a.scope||!a.source){a.phase='changed';push('assistant','The selected source changed. I’ve paused before starting another operation. Confirm the current context to continue.');render();return}a.step++;if(a.step>=4){a.phase='ready';a.artifact=true;push('assistant',a.year?'Prepared the brief using only decisions dated in 2026. I checked the cited excerpts; the document is ready for your review. No file has been saved.':'Prepared a brief covering the selected notes. I checked the cited excerpts; the document is ready for your review. No file has been saved.','artifact');say('Brief ready for review.')}render();if(a.phase==='running')tick()},2400)}function steerSeed(){a.draft='Only this year.';render();$('#composer').focus()}function applySteering(){clearTimeout(a.timer);a.year=true;a.step=Math.min(a.step,1);push('assistant','Understood — only decisions dated in 2026. I’ll keep the source inspection and recheck the extraction against that constraint.');render();tick()}function stopTask(){if(a.phase!=='running')return;saveDraft();clearTimeout(a.timer);a.phase='stopping';render();say('Stop acknowledged. No new operations will start; an in-flight operation may finish.');a.timer=setTimeout(()=>{a.phase='stopped';push('assistant',`Stopped after ${a.step} checked preparation steps. The interrupted operation is unverified. No files were changed.`);render()},400)}function resume(){if(!a.model){go('settings');say('Local model must be restored before resuming.');return}if(a.scope!==a.sourceVersion||!a.source){a.phase='changed';render();return}push('assistant','I’ve rechecked the source scope. I’ll continue from the last checked step and reconcile the interrupted operation first.');a.phase='running';render();tick()}function renewScope(){if(!a.model){go('settings');say('Restore the local model before continuing. No hosted fallback will be used.');return}if(a.phase==='stopping')return;if(!a.source){say('Attach example notes first.');return}a.scope=a.sourceVersion;a.step=0;push('assistant','Using the currently selected notes. I’ll refresh the source observations before continuing.');a.phase='running';render();tick()}
function artifactText(year){return year?'PROJECT DECISIONS — 2026\n\n• Keep task processing on device. (2026-10-12)\n• Maya owns the onboarding draft review. (2026-10-18)\n\n2025 pilot notes were excluded.':'PROJECT DECISIONS\n\n• Keep task processing on device. (2026-10-12)\n• Maya owns the onboarding draft review. (2026-10-18)\n• Run an initial pilot with three users. (2025-11-03)'}function openArtifact(i){const record=a.messages[i];const d=document.createElement('dialog');d.className='artifact-dialog';d.innerHTML=`<div class="card-head"><h3>Project decisions brief</h3><button class="btn quiet" onclick="this.closest('dialog').close()">Close</button></div><div class="simple-body"><p class="note-line">Prepared in chat · synthetic example · not saved to disk</p><pre>${esc(artifactText(record.year))}</pre><details class="evidence"><summary>Source excerpts</summary><p>2026-10-12: “We agreed to keep task processing on device.”<br>2026-10-18: “Maya owns the onboarding review.”${record.year?'':'<br>2025-11-03: “Start with a three-user pilot.”'}</p></details></div>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()}
function memory(){heading('A few things worth remembering.','Only preferences and reusable facts you explicitly approve.','Memory');$('#content').innerHTML=`<div class="card wide-card"><div class="card-head"><div class="card-title">${icon('memory')}<h3>Approved memory</h3></div><span class="filetag">ON THIS MAC</span></div><div class="simple-body">${a.memories.map(m=>`<div class="memory-row"><div class="grow"><label for="memory-${m.id}">${esc(m.kind)}</label><input id="memory-${m.id}" value="${esc(m.value)}" aria-label="Edit approved memory" onchange="editMemory(${m.id},this.value)"></div>${button(icon('trash'),`deleteMemory(${m.id})`)}</div>`).join('')||'<p class="sub">No persistent preferences or facts approved.</p>'}<form onsubmit="event.preventDefault();addMemory()" class="memory-add"><label for="new-memory">Explicitly approve a preference or reusable fact</label><input id="new-memory" placeholder="For example: use British English"><button class="btn primary" type="submit">Approve & remember</button></form><p class="note-line">Nothing from conversation becomes memory automatically. Sensitive information is not silently retained. This preview stores edits in session memory only.</p></div></div><div class="safety wide-card" style="margin-top:20px"><div class="safety-title">${icon('folder')}Folder indexing is a later capability</div><p>First release focuses on explicit preferences and approved facts. Continuous collection, automatic folder ingestion and hidden monitoring are outside this release.</p></div>`;footer('View, edit and delete memory. Original files and messages are unaffected.',[button('Back to conversation',"go('chat')")])}function editMemory(id,v){a.memories=a.memories.map(m=>m.id===id?{...m,value:v}:m);say('Approved memory updated in this session.')}function deleteMemory(id){a.memories=a.memories.filter(m=>m.id!==id);render();say('Memory deleted.')}function addMemory(){const value=$('#new-memory').value.trim();if(!value)return;a.memories.push({id:Date.now(),kind:'Approved fact / preference',value});render();say('Explicit memory approved in this session.')}
function activity(){heading('The work, in plain sight.','Observations and outcomes, without hidden model reasoning.','Activity');$('#content').innerHTML=`<div class="card wide-card"><div class="simple-body"><h2>Project decisions</h2><p class="sub">${a.messages.length?'Current conversation':'No task started'} · ${a.step} checked preparation steps</p><div style="margin-top:20px">${runCard()||'<p class="note-line">No task is currently running.</p>'}</div><p class="note-line">A production event record distinguishes planned, requested, executed, verified, failed and effect-uncertain states. Crash recovery reconciles effects before replaying any mutation.</p></div></div>`;footer('Stop remains available across navigation while work is running.',[button('Return to conversation',"go('chat')",'primary')])}
function settings(){heading('Ready to work on this Mac.','Model, driver and permissions are separate checks.','Settings & readiness');$('#content').innerHTML=`<div class="card wide-card"><div class="simple-body">${[['model','Local model',a.model?'Provisioned · synthetic readiness example':'Unavailable · task execution blocked'],['spark','Model capabilities','Text, image input, tool calls and cancellation require hardware tests'],['monitor','Computer-control driver','Not connected in this preview · independent readiness check'],['shield','macOS permissions','Requested only when a supported capability needs them']].map(([i,t,s],n)=>`<div class="checkrow"><div class="checkicon">${icon(i)}</div><div class="grow"><h3>${t}</h3><p>${s}</p></div>${n===0?button(a.model?'Simulate unavailable':'Restore example readiness','toggleModel()'):'<span class="tiny">Prototype</span>'}</div>`).join('')}<div class="safety" style="margin-top:20px"><div class="safety-title">${icon('lock')}Local models. Internet when the task needs it.</div><p>Inference and context processing use local models only. No hosted model or fallback is offered. User-requested browser tasks may connect to websites and disclose the relevant site and submitted content. Disconnected local tasks remain available; network-dependent work pauses and preserves partial progress when offline. No network task is implemented in this preview.</p></div><p class="note-line">Provisioning, downloads and updates must be distinguished from task execution. No download or outbound request occurs in this prototype.</p></div></div>`;footer('No hosted model or fallback. This preview implements no network action.',[button('Back to conversation',"go('chat')")])}function toggleModel(){a.model=!a.model;if(!a.model&&a.phase==='running')stopTask();render()}function render(){$('.shell').dataset.page=a.page;const previousComposer=$('#composer');const composing=previousComposer&&document.activeElement===previousComposer;const selection=composing?[previousComposer.selectionStart,previousComposer.selectionEnd]:null;const previousThread=$('#thread');const threadTop=previousThread?previousThread.scrollTop:0;const followLatest=!previousThread||previousThread.scrollHeight-previousThread.clientHeight-threadTop<48;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===a.page));$('#crumb').textContent=pages[a.page][1];$('#global-stop').hidden=!['running','stopping'].includes(a.phase);$('#global-stop').disabled=a.phase==='stopping';$('#global-stop').textContent=a.phase==='stopping'?'Stopping…':'Stop task';$('#model-pill').innerHTML='<span class="dot"></span>'+(a.model?'Local model ready':'Local readiness needed');({chat,memory,activity,settings}[a.page])();const currentThread=$('#thread');if(currentThread)currentThread.scrollTop=followLatest?currentThread.scrollHeight:threadTop;if(composing&&$('#composer')){$('#composer').focus({preventScroll:true});$('#composer').setSelectionRange(...selection)}}function resetDemo(){clearTimeout(a.timer);a.messages=[];a.phase='idle';a.step=0;a.page='chat';a.draft='';a.artifact=false;render()}document.addEventListener('keydown',e=>{document.documentElement.classList.add('keyboard');if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&$('#composer')){e.preventDefault();send()}});document.addEventListener('pointerdown',()=>document.documentElement.classList.remove('keyboard'));render();
</script></html>
